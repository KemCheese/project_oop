<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dang nhap - TicketPass</title>
</head>
<body>
    <div th:replace="~{layout/base :: layout('Dang nhap - TicketPass', ~{::content})}">
        <content>
            <style>
                .auth-wrapper {
                    max-width: 440px;
                    margin: 40px auto;
                    background: var(--color-surface);
                    border: 1px solid var(--color-border);
                    border-radius: var(--radius-lg);
                    padding: var(--spacing-xl);
                }
                .auth-title {
                    font-size: 24px;
                    font-weight: 700;
                    color: var(--color-brand);
                    text-align: center;
                    margin-bottom: var(--spacing-lg);
                }
                
                .auth-alert {
                    padding: 12px 16px;
                    border-radius: var(--radius-sm);
                    margin-bottom: var(--spacing-lg);
                    font-size: 14px;
                    text-align: center;
                }
                .auth-alert.error {
                    background-color: var(--color-danger-surface);
                    color: var(--color-danger);
                    border: 1px solid var(--color-danger-border);
                }
                .auth-alert.success {
                    background-color: var(--color-success-surface);
                    color: var(--color-success);
                    border: 1px solid var(--color-success-border);
                }

                .field { margin-bottom: var(--spacing-md); }
                .field-label {
                    display: block;
                    font-size: 13px;
                    font-weight: 600;
                    color: var(--color-brand);
                    margin-bottom: var(--spacing-xs);
                }
                .field-input {
                    width: 100%;
                    padding: 10px 12px;
                    font-size: 14px;
                    font-family: inherit;
                    color: var(--color-text-main);
                    background: var(--color-surface);
                    border: 1px solid var(--color-border);
                    border-radius: var(--radius-sm);
                    transition: all var(--transition-fast);
                    outline: none;
                }
                .field-input:focus {
                    border-color: var(--color-primary);
                    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
                }
                
                .btn-submit {
                    width: 100%;
                    padding: 12px;
                    margin-top: var(--spacing-md);
                }

                .auth-footer {
                    margin-top: var(--spacing-lg);
                    text-align: center;
                    font-size: 14px;
                    color: var(--color-text-muted);
                }
                .auth-footer a {
                    color: var(--color-primary);
                    font-weight: 600;
                }
                .auth-footer a:hover {
                    text-decoration: underline;
                }
            </style>

            <div class="auth-wrapper">
                <h1 class="auth-title">Dang nhap</h1>

                <!-- Alerts -->
                <div class="auth-alert error" th:if="${param.error}">
                    Email hoac mat khau khong dung.
                </div>
                <div class="auth-alert success" th:if="${param.logout}">
                    Ban da dang xuat thanh cong.
                </div>
                <div class="auth-alert success" th:if="${param.registered}">
                    Dang ky thanh cong. Vui long dang nhap.
                </div>

                <form method="post" action="/login">
                    <div class="field">
                        <label class="field-label" for="username">Email</label>
                        <input type="email" id="username" name="username" class="field-input" required maxlength="255" placeholder="nhap.email@cua-ban.com">
                    </div>
                    
                    <div class="field">
                        <label class="field-label" for="password">Mat khau</label>
                        <input type="password" id="password" name="password" class="field-input" required placeholder="••••••••">
                    </div>
                    
                    <button type="submit" class="btn btn-brand btn-submit">Dang nhap vao he thong</button>
                </form>

                <div class="auth-footer">
                    Chua co tai khoan? <a th:href="@{/register}">Dang ky ngay</a>
                </div>
            </div>
            
        </content>
    </div>
</body>
</html>
