<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Đăng ký tài khoản - TicketPass</title>
</head>

<body>
    <div th:replace="~{layout/base :: layout('Đăng ký tài khoản - TicketPass', ~{::content})}">
        <content>
            <style>
                .auth-wrapper {
                    max-width: 500px;
                    margin: 30px auto;
                    background: var(--color-surface);
                    border: 1px solid var(--color-border);
                    border-radius: var(--radius-lg);
                    padding: 32px 28px;
                    box-shadow: var(--shadow-card);
                }

                .auth-title {
                    font-size: 24px;
                    font-weight: 800;
                    color: var(--color-brand);
                    text-align: center;
                    margin-bottom: 8px;
                }

                .auth-sub {
                    font-size: 13px;
                    color: var(--color-text-muted);
                    text-align: center;
                    margin-bottom: 24px;
                }

                .form-row {
                    display: grid;
                    grid-template-columns: 1fr 1fr;
                    gap: 16px;
                }

                @media (max-width: 560px) {
                    .form-row {
                        grid-template-columns: 1fr;
                    }
                }
            </style>

            <div class="auth-wrapper">
                <h1 class="auth-title">Đăng Ký Tài Khoản</h1>
                <p class="auth-sub">
                    Tham gia sàn giao dịch vé an toàn và nhận ngay 100 điểm uy tín khởi tạo
                </p>

                <form method="post" th:action="@{/register}" th:object="${registerRequest}" novalidate>
                    <!-- Global errors -->
                    <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" style="font-size: 13px;">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                        <span th:each="err : ${#fields.globalErrors()}" th:text="${err}">Lỗi đăng ký</span>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="fullName">Họ và tên <span class="required">*</span></label>
                        <input type="text" id="fullName" th:field="*{fullName}" class="form-control"
                               th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                               placeholder="Nguyễn Văn A" required />
                        <div th:if="${#fields.hasErrors('fullName')}" class="form-error" th:errors="*{fullName}"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="email">Địa chỉ Email <span class="required">*</span></label>
                        <input type="email" id="email" th:field="*{email}" class="form-control"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                               placeholder="email@example.com" required />
                        <div th:if="${#fields.hasErrors('email')}" class="form-error" th:errors="*{email}"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="phoneNumber">Số điện thoại <span class="required">*</span></label>
                        <input type="tel" id="phoneNumber" th:field="*{phoneNumber}" class="form-control"
                               th:classappend="${#fields.hasErrors('phoneNumber')} ? 'is-invalid' : ''"
                               placeholder="0912345678" required />
                        <div th:if="${#fields.hasErrors('phoneNumber')}" class="form-error" th:errors="*{phoneNumber}"></div>
                        <span class="form-text">Gồm 10 chữ số, bắt đầu bằng số 0</span>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="password">Mật khẩu <span class="required">*</span></label>
                            <input type="password" id="password" th:field="*{password}" class="form-control"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                                   placeholder="Tối thiểu 8 ký tự" required />
                            <div th:if="${#fields.hasErrors('password')}" class="form-error" th:errors="*{password}"></div>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="confirmPassword">Xác nhận mật khẩu <span class="required">*</span></label>
                            <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control"
                                   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"
                                   placeholder="Nhập lại mật khẩu" required />
                            <div th:if="${#fields.hasErrors('confirmPassword')}" class="form-error" th:errors="*{confirmPassword}"></div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
                        <i class="fa-solid fa-user-plus"></i> Hoàn tất đăng ký tài khoản
                    </button>
                </form>

                <div style="margin-top: 20px; text-align: center; font-size: 13px; color: var(--color-text-muted);">
                    Đã có tài khoản? <a th:href="@{/login}" style="color: var(--color-primary); font-weight: 600;">Đăng nhập tại đây</a>
                </div>
            </div>
        </content>
    </div>
</body>

</html>
