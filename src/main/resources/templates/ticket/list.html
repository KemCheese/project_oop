<!DOCTYPE html>
<!--
  Danh sach ve dang ban tren san TicketPass.
  Hien thi grid card ve, ho tro loc theo loai ve.
  Dung CSS custom properties (design tokens) de dam bao tinh nhat quan.

  Model attributes:
    - tickets       : List<TicketSummaryResponse>
    - ticketTypes   : TicketType[]
    - selectedType  : String (null khi khong loc)

  Chu so huu: Nguoi A
-->
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vé đang bán - TicketPass</title>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== Design Tokens ===== */
        :root {
            --font-base: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --color-primary: #e71a0f;
            --color-primary-hover: #cc150b;
            --color-primary-surface: #fdf2f2;
            --color-accent: #c2410c;
            --color-accent-hover: #9a3412;
            --color-surface: #ffffff;
            --color-bg: #fdfcf0;
            --color-border: #e2e8f0;
            --color-text: #0f172a;
            --color-text-secondary: #475569;
            --color-text-muted: #94a3b8;
            --radius-sm: 6px;
            --radius-md: 10px;
            --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-card-hover: 0 4px 12px rgba(0, 0, 0, 0.1);
            --transition: 0.2s ease;
        }

        /* ===== Reset & Base ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-base);
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== Header ===== */
        .site-header {
            background: var(--color-surface);
            border-bottom: 1px solid var(--color-border);
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-inner {
            max-width: 1120px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 56px;
        }

        .site-logo {
            font-size: 18px;
            font-weight: 700;
            color: var(--color-primary);
            text-decoration: none;
            letter-spacing: -0.3px;
        }

        .header-nav {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-nav a {
            font-size: 14px;
            color: var(--color-text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: color var(--transition);
        }

        .header-nav a:hover {
            color: var(--color-primary);
        }

        /* ===== Page Layout ===== */
        .page-container {
            max-width: 1120px;
            margin: 0 auto;
            padding: 32px 24px 64px;
        }

        /* ===== Page Header ===== */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--color-text);
        }

        .btn-create {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            background: var(--color-primary);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: var(--radius-sm);
            text-decoration: none;
            cursor: pointer;
            transition: background var(--transition);
        }

        .btn-create:hover {
            background: var(--color-primary-hover);
        }

        /* ===== Filter Bar ===== */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 28px;
        }

        .filter-btn {
            padding: 7px 16px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid var(--color-border);
            border-radius: 20px;
            background: var(--color-surface);
            color: var(--color-text-secondary);
            text-decoration: none;
            transition: all var(--transition);
            white-space: nowrap;
        }

        .filter-btn:hover {
            border-color: var(--color-primary);
            color: var(--color-primary);
        }

        .filter-btn.active {
            background: var(--color-primary);
            border-color: var(--color-primary);
            color: #fff;
        }

        /* ===== Ticket Grid ===== */
        .ticket-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        /* ===== Ticket Card ===== */
        .ticket-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            transition: box-shadow var(--transition), transform var(--transition);
        }

        .ticket-card:hover {
            box-shadow: var(--shadow-card-hover);
            transform: translateY(-2px);
        }

        .card-image-wrap {
            position: relative;
            aspect-ratio: 16 / 10;
            background: #e8ecf1;
            overflow: hidden;
        }

        .card-image-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Placeholder khi khong co anh */
        .card-image-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-text-muted);
            font-size: 13px;
        }

        .card-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 3px 10px;
            border-radius: 4px;
            background: var(--color-primary);
            color: #fff;
        }

        .card-badge.type-CONCERT {
            background: #7c3aed;
        }

        .card-badge.type-BUS {
            background: #0d9488;
        }

        .card-body {
            padding: 14px 16px 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--color-text);
            line-height: 1.4;
            margin-bottom: 4px;
            /* Xu ly ten dai: tu dong cat dong */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
        }

        .card-event {
            font-size: 13px;
            color: var(--color-text-secondary);
            margin-bottom: 10px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .card-meta {
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .card-date {
            font-size: 12px;
            color: var(--color-text-muted);
        }

        .card-price {
            font-size: 16px;
            font-weight: 700;
            color: var(--color-accent);
            white-space: nowrap;
        }

        /* ===== Empty State ===== */
        .empty-state {
            text-align: center;
            padding: 64px 24px;
            color: var(--color-text-muted);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.4;
        }

        .empty-state h3 {
            font-size: 18px;
            color: var(--color-text-secondary);
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 14px;
        }

        /* ===== Responsive ===== */
        @media (max-width: 640px) {
            .page-header {
                flex-direction: column;
                align-items: stretch;
            }

            .btn-create {
                justify-content: center;
            }

            .ticket-grid {
                grid-template-columns: 1fr;
            }

            .page-container {
                padding: 20px 16px 48px;
            }
        }

        /* ==========================================================================
           CGV HEADER CLONE STYLES
           ========================================================================== */
        :root {
            --cgv-red: #e71a0f;
            --cgv-bg: #fdfcf0;
            --cgv-gray: #666666;
        }

        .cgv-header {
            background-color: var(--cgv-bg);
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            max-width: 1120px;
            margin: 0 auto;
            padding: 8px 24px;
            font-size: 13px;
            gap: 20px;
        }

        .top-menu {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .top-menu a,
        .top-menu button {
            text-decoration: none;
            color: var(--cgv-gray);
            display: flex;
            align-items: center;
            gap: 5px;
            text-transform: uppercase;
            font-family: var(--font-base);
            font-weight: 600;
            transition: color 0.2s;
        }

        .top-menu a:hover,
        .top-menu button:hover {
            color: var(--cgv-red);
        }

        .lang-switch {
            display: flex;
            gap: 2px;
        }

        .lang-btn {
            padding: 4px 8px;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 12px;
            border-radius: 3px;
        }

        .lang-btn.active {
            background-color: var(--cgv-red);
        }

        .lang-btn:not(.active) {
            background-color: #999;
        }

        .header-separator {
            height: 12px;
            background-color: var(--cgv-red);
            background-image: radial-gradient(circle, #fff 2px, transparent 2.5px);
            background-size: 16px 12px;
            background-position: center;
        }

        .main-nav {
            max-width: 1120px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 24px;
            background-image: repeating-linear-gradient(transparent, transparent 30px, #000000 30px, #000000 31px);
        }

        .main-nav>* {
            background-color: var(--cgv-bg);
        }

        .logo {
            display: flex;
            align-items: flex-start;
            text-decoration: none;
            padding-right: 30px;
        }

        .logo-text {
            color: var(--cgv-red);
            font-size: 42px;
            font-weight: 900;
            font-style: italic;
            letter-spacing: -2px;
            line-height: 1;
        }

        .logo-icon {
            color: var(--cgv-red);
            font-size: 18px;
            margin-top: -5px;
        }

        .nav-items {
            display: flex;
            gap: 30px;
            flex: 1;
            padding-top: 5px;
        }

        .nav-items a {
            text-decoration: none;
            color: var(--color-text);
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            padding: 0 10px;
            transition: color 0.2s;
        }

        .nav-items a:hover,
        .nav-items a.active {
            color: var(--cgv-red);
        }

        .buy-ticket-btn {
            position: relative;
            background-color: var(--cgv-red);
            color: #fff !important;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            padding: 10px 20px;
            border-radius: 8px;
            text-transform: uppercase;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transform: rotate(-3deg);
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px dashed rgba(255, 255, 255, 0.4);
            margin-left: 20px;
        }

        .buy-ticket-btn:hover {
            transform: rotate(0deg) scale(1.05);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        @media (max-width: 860px) {
            .top-bar {
                flex-direction: column;
                gap: 10px;
            }

            .main-nav {
                flex-direction: column;
                gap: 15px;
                background-image: none;
            }

            .logo {
                padding-right: 0;
            }

            .nav-items {
                flex-wrap: wrap;
                justify-content: center;
                gap: 15px;
                padding-top: 0;
            }

            .buy-ticket-btn {
                transform: none;
                margin-top: 10px;
                margin-left: 0;
            }
        }
    </style>
</head>

<body>

    <!-- ===== Header CGV Style ===== -->
    <header class="cgv-header">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="top-menu">
                <a th:href="@{/tickets}"><i class="fa-solid fa-tags"></i> Vé đang bán</a>

                <th:block th:if="${#authorization.expression('isAuthenticated()')}">
                    <a th:href="@{/profile}"><i class="fa-solid fa-ticket"></i> Hồ sơ của tôi</a>
                    <form th:action="@{/logout}" method="post" style="display:inline; margin:0;">
                        <button type="submit" style="background:none; border:none; cursor:pointer;"><i
                                class="fa-solid fa-right-from-bracket"></i> Đăng xuất</button>
                    </form>
                </th:block>

                <th:block th:if="${!#authorization.expression('isAuthenticated()')}">
                    <a th:href="@{/login}"><i class="fa-regular fa-user"></i> Đăng nhập / Đăng ký</a>
                </th:block>
            </div>
            <div class="lang-switch">
                <a href="#" class="lang-btn active">VN</a>
                <a href="#" class="lang-btn">EN</a>
            </div>
        </div>

        <!-- Dotted Separator -->
        <div class="header-separator"></div>

        <!-- Main Nav -->
        <div class="main-nav">
            <!-- Logo -->
            <a th:href="@{/}" class="logo">
                <span class="logo-text">TicketPass</span>
                <i class="fa-solid fa-asterisk logo-icon"></i>
            </a>

            <!-- Menu Items -->
            <div class="nav-items">
                <a th:href="@{/tickets}" th:classappend="${selectedType == null} ? 'active' : ''">Tất cả</a>
                <a th:href="@{/tickets(ticketType='MOVIE')}"
                    th:classappend="${selectedType != null and selectedType.toUpperCase() == 'MOVIE'} ? 'active' : ''">Phim</a>
                <a th:href="@{/tickets(ticketType='CONCERT')}"
                    th:classappend="${selectedType != null and selectedType.toUpperCase() == 'CONCERT'} ? 'active' : ''">Sự
                    kiện</a>
                <a th:href="@{/tickets(ticketType='BUS')}"
                    th:classappend="${selectedType != null and selectedType.toUpperCase() == 'BUS'} ? 'active' : ''">Xe
                    khách</a>
            </div>

            <!-- Buy/Sell Button -->
            <a th:href="@{/tickets/new}" class="buy-ticket-btn">
                <i class="fa-solid fa-ticket-simple"></i> Đăng vé ngay
            </a>
        </div>

        <!-- Dotted Separator Bottom -->
        <div class="header-separator"></div>
    </header>

    <!-- ===== Main Content ===== -->
    <div class="page-container">

        <!-- Page Header -->
        <div class="page-header">
            <h1 class="page-title">Vé đang bán</h1>
            <a th:href="@{/tickets/new}" class="btn-create">Đăng vé mới</a>
        </div>

        <!-- Ticket Grid -->
        <div class="ticket-grid" th:if="${!tickets.isEmpty()}">
            <a th:each="t : ${tickets}" th:href="@{/tickets/{id}(id=${t.id})}" class="ticket-card">

                <div class="card-image-wrap">
                    <img th:if="${t.thumbnailUrl != null}" th:src="${t.thumbnailUrl}" alt="Anh ve">
                    <div th:if="${t.thumbnailUrl == null}" class="card-image-placeholder">
                        Chưa có ảnh
                    </div>
                    <span class="card-badge" th:classappend="'type-' + ${t.ticketType.name()}"
                        th:text="${t.ticketType.name()}"></span>
                </div>

                <div class="card-body">
                    <div class="card-title" th:text="${t.title}">Tên vé</div>
                    <div class="card-event" th:text="${t.eventName}">Tên sự kiện</div>
                    <div class="card-meta">
                        <span class="card-date"
                            th:text="${#temporals.format(t.eventStartAt, 'dd/MM/yyyy HH:mm')}">01/01/2026</span>
                        <span class="card-price"
                            th:text="${#numbers.formatDecimal(t.salePrice, 0, 'COMMA', 0, 'POINT')} + 'đ'">100.000đ</span>
                    </div>
                </div>
            </a>
        </div>

        <!-- Empty State -->
        <div class="empty-state" th:if="${tickets.isEmpty()}">
            <div class="empty-state-icon">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="2" y="4" width="20" height="16" rx="2" />
                    <path d="M2 10h20" />
                    <path d="M10 4v16" />
                </svg>
            </div>
            <h3>Chưa có vé nào được rao bán</h3>
            <p>Hãy là người đầu tiên đăng vé trên sàn.</p>
        </div>

    </div>

</body>

</html>
