<!DOCTYPE html>
<!--
  Layout khung của toàn bộ giao diện TicketPass.
  Bao gồm: Header (Navbar), Footer, và bộ Design Tokens (CSS Variables) chuẩn tập trung.

  Cách dùng ở các view con:
      <div th:replace="~{layout/base :: layout('Tiêu đề trang', ~{::content})}">
          <content> Nội dung chính của trang </content>
      </div>
-->
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)" lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">TicketPass</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome 6.4.0 for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ==========================================================================
           DESIGN SYSTEM TOKENS (Quy chuẩn thiết kế tập trung)
           ========================================================================== */
        :root {
            /* Typography */
            --font-base: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

            /* Brand & Primary Actions */
            --color-brand: #0f172a;           /* Slate 900 - Nền nã, uy quyền, cao cấp */
            --color-brand-hover: #1e293b;
            --color-brand-surface: #f1f5f9;

            --color-primary: #e71a0f;         /* CGV Red - Sắc nét, hành động mua/đăng vé */
            --color-primary-hover: #cc150b;
            --color-primary-surface: #fef2f2;
            --color-primary-border: #fecaca;

            --color-accent: #ea580c;          /* Orange 600 - Điểm nhấn giá tiền, giao dịch */
            --color-accent-hover: #c2410c;

            /* Semantic Status */
            --color-success: #16a34a;         /* Xanh lá - Hoàn tất, vé khả dụng, uy tín cao */
            --color-success-hover: #15803d;
            --color-success-surface: #f0fdf4;
            --color-success-border: #bbf7d0;

            --color-warning: #d97706;         /* Vàng hổ phách - Chờ cọc, chờ xác nhận */
            --color-warning-surface: #fffbeb;
            --color-warning-border: #fde68a;

            --color-danger: #dc2626;          /* Đỏ - Tranh chấp, hủy vé, cảnh báo lừa đảo */
            --color-danger-surface: #fef2f2;
            --color-danger-border: #fecaca;

            --color-info: #0284c7;
            --color-info-surface: #f0f9ff;
            --color-info-border: #bae6fd;

            /* Background & Surfaces */
            --color-bg: #f8fafc;              /* Slate 50 - Nền sáng hiện đại, thanh thoát */
            --color-surface: #ffffff;         /* Trắng thuần cho Card và Container */
            --color-border: #e2e8f0;          /* Slate 200 */
            --color-border-hover: #cbd5e1;

            /* Text */
            --color-text-main: #0f172a;       /* Slate 900 */
            --color-text-secondary: #475569;  /* Slate 600 */
            --color-text-muted: #64748b;      /* Slate 500 */

            /* Layout & Radius */
            --container-max-width: 1200px;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --radius-full: 9999px;

            /* Shadows & Motion (Restrained Motion: 2/10) */
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.04);
            --shadow-hover: 0 10px 15px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.03);
            --transition-base: 150ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ==========================================================================
           RESET & GLOBAL STYLES
           ========================================================================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-base);
            background-color: var(--color-bg);
            color: var(--color-text-main);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        a {
            color: inherit;
            text-decoration: none;
            transition: color var(--transition-base);
        }

        img {
            max-width: 100%;
            display: block;
        }

        /* ==========================================================================
           HEADER & NAVIGATION (CGV Inspired Trust-First Header)
           ========================================================================== */
        .site-header {
            background-color: var(--color-surface);
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: var(--shadow-sm);
            border-bottom: 1px solid var(--color-border);
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            max-width: var(--container-max-width);
            margin: 0 auto;
            padding: 8px 24px;
            font-size: 13px;
            gap: 20px;
            border-bottom: 1px solid #f1f5f9;
        }

        .top-menu {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .top-menu a, .top-menu button {
            text-decoration: none;
            color: var(--color-text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            transition: color var(--transition-base);
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }

        .top-menu a:hover, .top-menu button:hover {
            color: var(--color-primary);
        }

        .header-separator {
            height: 4px;
            background-color: var(--color-primary);
        }

        .main-nav {
            max-width: var(--container-max-width);
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 4px;
            text-decoration: none;
        }

        .logo-text {
            color: var(--color-primary);
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            line-height: 1;
        }

        .logo-icon {
            color: var(--color-accent);
            font-size: 14px;
        }

        .nav-items {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .nav-items a {
            font-size: 14px;
            font-weight: 600;
            color: var(--color-text-main);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            transition: all var(--transition-base);
        }

        .nav-items a:hover, .nav-items a.active {
            color: var(--color-primary);
            background-color: var(--color-primary-surface);
        }

        .post-ticket-btn {
            background-color: var(--color-primary);
            color: #ffffff !important;
            font-weight: 600;
            font-size: 14px;
            padding: 8px 18px;
            border-radius: var(--radius-md);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 4px rgba(231, 26, 15, 0.2);
            transition: all var(--transition-base);
        }

        .post-ticket-btn:hover {
            background-color: var(--color-primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(231, 26, 15, 0.3);
        }

        /* ==========================================================================
           MAIN CONTENT AREA
           ========================================================================== */
        .site-main {
            flex: 1;
            width: 100%;
            max-width: var(--container-max-width);
            margin: 0 auto;
            padding: 32px 24px;
        }

        /* ==========================================================================
           COMMON UI COMPONENTS
           ========================================================================== */
        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            border-radius: var(--radius-md);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all var(--transition-base);
            font-family: inherit;
            line-height: 1.4;
            min-height: 42px;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-primary {
            background-color: var(--color-primary);
            color: #ffffff;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: var(--color-primary-hover);
            color: #ffffff;
        }

        .btn-brand {
            background-color: var(--color-brand);
            color: #ffffff;
        }

        .btn-brand:hover:not(:disabled) {
            background-color: var(--color-brand-hover);
            color: #ffffff;
        }

        .btn-outline {
            background-color: transparent;
            border-color: var(--color-border);
            color: var(--color-text-main);
        }

        .btn-outline:hover:not(:disabled) {
            background-color: var(--color-bg);
            border-color: var(--color-border-hover);
        }

        .btn-danger {
            background-color: var(--color-danger);
            color: #ffffff;
        }

        .btn-danger:hover:not(:disabled) {
            background-color: #b91c1c;
        }

        .btn-danger-outline {
            background-color: transparent;
            border-color: var(--color-danger-border);
            color: var(--color-danger);
        }

        .btn-danger-outline:hover:not(:disabled) {
            background-color: var(--color-danger-surface);
        }

        .btn-success {
            background-color: var(--color-success);
            color: #ffffff;
        }

        .btn-success:hover:not(:disabled) {
            background-color: var(--color-success-hover);
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 13px;
            min-height: 34px;
        }

        .btn-lg {
            padding: 14px 28px;
            font-size: 16px;
            min-height: 48px;
        }

        /* Cards */
        .card {
            background-color: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            overflow: hidden;
            transition: all var(--transition-base);
        }

        .card:hover {
            box-shadow: var(--shadow-hover);
        }

        .card-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--color-border);
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-body {
            padding: 20px;
        }

        .card-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--color-border);
            background-color: #fafbfc;
        }

        /* Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 600;
            border-radius: var(--radius-full);
            white-space: nowrap;
        }

        .badge-movie {
            background-color: var(--color-primary-surface);
            color: var(--color-primary);
            border: 1px solid var(--color-primary-border);
        }

        .badge-concert {
            background-color: #f5f3ff;
            color: #7c3aed;
            border: 1px solid #ddd6fe;
        }

        .badge-bus {
            background-color: #ecfeff;
            color: #0891b2;
            border: 1px solid #a5f3fc;
        }

        .badge-success {
            background-color: var(--color-success-surface);
            color: var(--color-success);
            border: 1px solid var(--color-success-border);
        }

        .badge-warning {
            background-color: var(--color-warning-surface);
            color: var(--color-warning);
            border: 1px solid var(--color-warning-border);
        }

        .badge-danger {
            background-color: var(--color-danger-surface);
            color: var(--color-danger);
            border: 1px solid var(--color-danger-border);
        }

        .badge-neutral {
            background-color: var(--color-brand-surface);
            color: var(--color-text-secondary);
            border: 1px solid var(--color-border);
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--color-text-main);
            margin-bottom: 6px;
        }

        .form-label .required {
            color: var(--color-danger);
            margin-left: 2px;
        }

        .form-control {
            width: 100%;
            padding: 10px 14px;
            font-size: 14px;
            font-family: inherit;
            color: var(--color-text-main);
            background-color: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            transition: all var(--transition-base);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(231, 26, 15, 0.1);
        }

        .form-control.is-invalid {
            border-color: var(--color-danger);
            background-color: #fffbfa;
        }

        .form-text {
            display: block;
            margin-top: 4px;
            font-size: 12px;
            color: var(--color-text-muted);
        }

        .form-error {
            display: block;
            margin-top: 6px;
            font-size: 13px;
            color: var(--color-danger);
            font-weight: 500;
        }

        /* Alerts */
        .alert {
            padding: 14px 18px;
            border-radius: var(--radius-md);
            font-size: 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .alert-success {
            background-color: var(--color-success-surface);
            color: var(--color-success);
            border: 1px solid var(--color-success-border);
        }

        .alert-warning {
            background-color: var(--color-warning-surface);
            color: var(--color-warning);
            border: 1px solid var(--color-warning-border);
        }

        .alert-danger {
            background-color: var(--color-danger-surface);
            color: var(--color-danger);
            border: 1px solid var(--color-danger-border);
        }

        .alert-info {
            background-color: var(--color-info-surface);
            color: var(--color-info);
            border: 1px solid var(--color-info-border);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background-color: var(--color-surface);
            border-radius: var(--radius-lg);
            border: 1px dashed var(--color-border);
            margin: 20px 0;
        }

        .empty-icon {
            font-size: 48px;
            color: #cbd5e1;
            margin-bottom: 16px;
        }

        .empty-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--color-text-main);
            margin-bottom: 8px;
        }

        .empty-desc {
            font-size: 14px;
            color: var(--color-text-muted);
            max-width: 440px;
            margin: 0 auto 20px auto;
        }

        /* ==========================================================================
           FOOTER
           ========================================================================== */
        .site-footer {
            border-top: 1px solid var(--color-border);
            background-color: var(--color-surface);
            padding: 32px 0;
            margin-top: auto;
        }

        .site-footer-inner {
            max-width: var(--container-max-width);
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            font-size: 13px;
            color: var(--color-text-muted);
        }

        .footer-brand {
            font-weight: 700;
            color: var(--color-brand);
        }

        .footer-links {
            display: flex;
            gap: 20px;
        }

        .footer-links a:hover {
            color: var(--color-primary);
        }

        /* Responsive Mobile */
        @media (max-width: 768px) {
            .top-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
                padding: 10px 16px;
            }

            .main-nav {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
                padding: 12px 16px;
            }

            .nav-items {
                overflow-x: auto;
                padding-bottom: 4px;
                gap: 8px;
            }

            .site-main {
                padding: 20px 16px;
            }

            .site-footer-inner {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <!-- Header Navigation -->
    <header class="site-header">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="top-menu">
                <a th:href="@{/tickets}"><i class="fa-solid fa-tags"></i> Sàn vé</a>
                <a th:href="@{/reputation/top}"><i class="fa-solid fa-trophy"></i> Bảng xếp hạng</a>

                <th:block th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
                    <a th:href="@{/admin/disputes}"><i class="fa-solid fa-shield-halved"></i> Quản trị tranh chấp</a>
                </th:block>

                <th:block th:if="${#authorization.expression('isAuthenticated()')}">
                    <a th:href="@{/profile}"><i class="fa-solid fa-user-circle"></i> Hồ sơ của tôi</a>
                    <form th:action="@{/logout}" method="post" style="display:inline; margin:0;">
                        <button type="submit"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</button>
                    </form>
                </th:block>

                <th:block th:if="${!#authorization.expression('isAuthenticated()')}">
                    <a th:href="@{/login}"><i class="fa-regular fa-user"></i> Đăng nhập / Đăng ký</a>
                </th:block>
            </div>
        </div>

        <!-- Dotted Separator -->
        <div class="header-separator"></div>

        <!-- Main Nav -->
        <div class="main-nav">
            <!-- Logo -->
            <a th:href="@{/}" class="logo">
                <span class="logo-text">TicketPass</span>
                <i class="fa-solid fa-asterisk logo-icon"></i>
            </a>

            <!-- Menu Items: 3 loại vé chuẩn của sàn -->
            <div class="nav-items">
                <a th:href="@{/tickets}"
                   th:classappend="${selectedType == null and tickets != null} ? 'active' : ''">Tất cả vé</a>
                <a th:href="@{/tickets(ticketType='MOVIE')}"
                   th:classappend="${selectedType != null and selectedType.toUpperCase() == 'MOVIE'} ? 'active' : ''">
                    <i class="fa-solid fa-film"></i> Vé xem phim
                </a>
                <a th:href="@{/tickets(ticketType='CONCERT')}"
                   th:classappend="${selectedType != null and selectedType.toUpperCase() == 'CONCERT'} ? 'active' : ''">
                    <i class="fa-solid fa-music"></i> Vé sự kiện
                </a>
                <a th:href="@{/tickets(ticketType='BUS')}"
                   th:classappend="${selectedType != null and selectedType.toUpperCase() == 'BUS'} ? 'active' : ''">
                    <i class="fa-solid fa-bus"></i> Vé xe khách
                </a>
            </div>

            <!-- Post Ticket CTA -->
            <a th:href="@{/tickets/new}" class="post-ticket-btn">
                <i class="fa-solid fa-plus-circle"></i> Đăng vé ngay
            </a>
        </div>
    </header>

    <!-- Main Content Injection -->
    <main class="site-main">
        <div th:replace="${content}"></div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="site-footer-inner">
            <div>
                <span class="footer-brand">TicketPass</span> - Sàn giao dịch vé điện tử an toàn cho người Việt.
            </div>
            <div class="footer-links">
                <a th:href="@{/tickets}">Sàn vé</a>
                <a th:href="@{/reputation/top}">Xếp hạng uy tín</a>
                <a th:href="@{/tickets/new}">Đăng vé</a>
            </div>
            <div>
                TicketPass &copy; 2026. Bảo vệ thanh toán ký quỹ và cọc 50%.
            </div>
        </div>
    </footer>

</body>

</html>
