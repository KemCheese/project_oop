<!DOCTYPE html>
<!--
  Layout khung cua toan bo giao dien TicketPass.
  Bao gom: Header (Navbar), Footer, va bo Design Tokens (CSS Variables) chuan.

  Cach dung o cac view con:
      <div th:replace="~{layout/base :: layout('Tieu de trang', ~{::content})}">
          <content> Noi dung chinh cua trang </content>
      </div>

  Chu so huu giao dien: Nguoi A.
-->
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)" lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">TicketPass</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ==========================================================================
           DESIGN SYSTEM TOKENS (Quy chuan thiet ke)
           ========================================================================== */
        :root {
            /* Typography */
            --font-base: 'Inter', system-ui, -apple-system, sans-serif;

            /* Color Palette (Brand) */
            --color-brand: #0f172a;
            /* Slate 900 - Dark/Premium brand color */
            --color-brand-hover: #1e293b;
            --color-brand-surface: #f1f5f9;

            /* Action Colors */
            --color-primary: #e71a0f;
            /* CGV Red */
            --color-primary-hover: #cc150b;
            --color-primary-surface: #fdf2f2;

            --color-accent: #ea580c;
            /* Orange 600 - cho gia tien, the hien action mua */

            /* Status Colors */
            --color-success: #16a34a;
            /* Green 600 */
            --color-success-surface: #f0fdf4;
            --color-success-border: #86efac;

            --color-warning: #d97706;
            /* Amber 600 */
            --color-warning-surface: #fffbeb;
            --color-warning-border: #fcd34d;

            --color-danger: #dc2626;
            /* Red 600 */
            --color-danger-surface: #fef2f2;
            --color-danger-border: #fca5a5;

            /* Surface & Background */
            --color-bg: #fdfcf0;
            /* Mau nen cream CGV */
            --color-surface: #ffffff;
            --color-border: #e2e8f0;
            --color-border-hover: #cbd5e1;

            /* Text Colors */
            --color-text-main: #0f172a;
            --color-text-muted: #64748b;

            /* Spacing & Layout */
            --container-max-width: 1120px;
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;

            /* Radii & Shadows (Clean, no excessive soft shadows) */
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);

            /* Transitions */
            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ==========================================================================
           RESET & GLOBAL STYLES
           ========================================================================== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-base);
            background-color: var(--color-bg);
            color: var(--color-text-main);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        a {
            color: inherit;
            text-decoration: none;
            transition: color var(--transition-fast);
        }

        /* ==========================================================================
           HEADER (NAVBAR)
           ========================================================================== */
        .site-header {
            background-color: var(--color-surface);
            border-bottom: 1px solid var(--color-border);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .site-header-inner {
            max-width: var(--container-max-width);
            margin: 0 auto;
            padding: 0 var(--spacing-lg);
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .site-brand {
            font-size: 20px;
            font-weight: 700;
            color: var(--color-brand);
            letter-spacing: -0.5px;
        }

        .site-nav {
            display: flex;
            align-items: center;
            gap: var(--spacing-lg);
        }

        .site-nav a {
            font-size: 14px;
            font-weight: 500;
            color: var(--color-text-muted);
        }

        .site-nav a:hover,
        .site-nav a.active {
            color: var(--color-brand);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }

        /* Buttons (Base styles cho toan site) */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            border-radius: var(--radius-md);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all var(--transition-fast);
            font-family: inherit;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-brand {
            background-color: var(--color-brand);
            color: white;
        }

        .btn-brand:hover:not(:disabled) {
            background-color: var(--color-brand-hover);
        }

        .btn-outline {
            background-color: transparent;
            border-color: var(--color-border);
            color: var(--color-text-main);
        }

        .btn-outline:hover:not(:disabled) {
            background-color: var(--color-bg);
            border-color: var(--color-border-hover);
        }

        .btn-danger {
            background-color: transparent;
            border-color: var(--color-danger-border);
            color: var(--color-danger);
        }

        .btn-danger:hover:not(:disabled) {
            background-color: var(--color-danger-surface);
        }

        /* Form Reset to mau button logout */
        .nav-actions form {
            margin: 0;
        }

        /* Mobile menu toggle (An tren desktop) */
        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--color-text-main);
        }

        /* ==========================================================================
           MAIN CONTENT AREA
           ========================================================================== */
        .site-main {
            flex: 1;
            width: 100%;
            max-width: var(--container-max-width);
            margin: 0 auto;
            padding: var(--spacing-xl) var(--spacing-lg);
        }

        /* ==========================================================================
           FOOTER
           ========================================================================== */
        .site-footer {
            border-top: 1px solid var(--color-border);
            background-color: var(--color-surface);
            padding: var(--spacing-lg) 0;
            margin-top: auto;
        }

        .site-footer-inner {
            max-width: var(--container-max-width);
            margin: 0 auto;
            padding: 0 var(--spacing-lg);
            text-align: center;
            font-size: 13px;
            color: var(--color-text-muted);
        }

        /* ==========================================================================
           RESPONSIVE DESIGN (EDGE CASES)
           ========================================================================== */
        @media (max-width: 768px) {
            .site-nav {
                display: none;
                /* Xu ly gian luoc tren mobile, thuong the bang menu dropdown, nhung o day gian luoc UI */
            }

            .mobile-menu-btn {
                display: block;
            }

            .site-header-inner {
                padding: 0 var(--spacing-md);
            }

            .site-main {
                padding: var(--spacing-lg) var(--spacing-md);
            }

            /* Button tren mobile auto full width khi can */
            .btn-mobile-full {
                width: 100%;
            }
        }

        /* Utility Classes */
        .text-truncate {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .text-truncate-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* ==========================================================================
           CGV HEADER CLONE STYLES
           ========================================================================== */
        :root {
            --cgv-red: #e71a0f;
            --cgv-bg: #fdfcf0;
            --cgv-gray: #666666;
        }

        .cgv-header {
            background-color: var(--cgv-bg);
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: var(--shadow-sm);
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            max-width: var(--container-max-width);
            margin: 0 auto;
            padding: 8px var(--spacing-lg);
            font-size: 13px;
            gap: 20px;
        }

        .top-menu {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .top-menu a,
        .top-menu button {
            text-decoration: none;
            color: var(--cgv-gray);
            display: flex;
            align-items: center;
            gap: 5px;
            text-transform: uppercase;
            font-family: var(--font-base);
            font-weight: 600;
            transition: color 0.2s;
        }

        .top-menu a:hover,
        .top-menu button:hover {
            color: var(--cgv-red);
        }

        .lang-switch {
            display: flex;
            gap: 2px;
        }

        .lang-btn {
            padding: 4px 8px;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 12px;
            border-radius: 3px;
        }

        .lang-btn.active {
            background-color: var(--cgv-red);
        }

        .lang-btn:not(.active) {
            background-color: #999;
        }

        .header-separator {
            height: 12px;
            background-color: var(--cgv-red);
            background-image: radial-gradient(circle, #fff 2px, transparent 2.5px);
            background-size: 16px 12px;
            background-position: center;
        }

        .main-nav {
            max-width: var(--container-max-width);
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px var(--spacing-lg);
            background-image: repeating-linear-gradient(transparent, transparent 30px, #000000 30px, #000000 31px);
        }

        .main-nav>* {
            background-color: var(--cgv-bg);
        }

        .logo {
            display: flex;
            align-items: flex-start;
            text-decoration: none;
            padding-right: 30px;
        }

        .logo-text {
            color: var(--cgv-red);
            font-size: 42px;
            font-weight: 900;
            font-style: italic;
            letter-spacing: -2px;
            line-height: 1;
        }

        .logo-icon {
            color: var(--cgv-red);
            font-size: 18px;
            margin-top: -5px;
        }

        .nav-items {
            display: flex;
            gap: 30px;
            flex: 1;
            padding-top: 5px;
        }

        .nav-items a {
            text-decoration: none;
            color: var(--color-text-main);
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            padding: 0 10px;
            transition: color 0.2s;
        }

        .nav-items a:hover,
        .nav-items a.active {
            color: var(--cgv-red);
        }

        .buy-ticket-btn {
            position: relative;
            background-color: var(--cgv-red);
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            padding: 10px 20px;
            border-radius: 8px;
            text-transform: uppercase;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transform: rotate(-3deg);
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px dashed rgba(255, 255, 255, 0.4);
            margin-left: 20px;
        }

        .buy-ticket-btn:hover {
            transform: rotate(0deg) scale(1.05);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            color: #fff;
        }

        @media (max-width: 860px) {
            .top-bar {
                flex-direction: column;
                gap: 10px;
            }

            .main-nav {
                flex-direction: column;
                gap: 15px;
                background-image: none;
            }

            .logo {
                padding-right: 0;
            }

            .nav-items {
                flex-wrap: wrap;
                justify-content: center;
                gap: 15px;
                padding-top: 0;
            }

            .buy-ticket-btn {
                transform: none;
                margin-top: 10px;
                margin-left: 0;
            }
        }
    </style>
</head>

<body>

    <!-- Header CGV Style -->
    <header class="cgv-header">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="top-menu">
                <a th:href="@{/tickets}"><i class="fa-solid fa-tags"></i> Vé đang bán</a>

                <th:block th:if="${#authorization.expression('isAuthenticated()')}">
                    <a th:href="@{/profile}"><i class="fa-solid fa-ticket"></i> Hồ sơ của tôi</a>
                    <form th:action="@{/logout}" method="post" style="display:inline; margin:0;">
                        <button type="submit" style="background:none; border:none; cursor:pointer;"><i
                                class="fa-solid fa-right-from-bracket"></i> Đăng xuất</button>
                    </form>
                </th:block>

                <th:block th:if="${!#authorization.expression('isAuthenticated()')}">
                    <a th:href="@{/login}"><i class="fa-regular fa-user"></i> Đăng nhập / Đăng ký</a>
                </th:block>
            </div>
            <div class="lang-switch">
                <a href="#" class="lang-btn active">VN</a>
                <a href="#" class="lang-btn">EN</a>
            </div>
        </div>

        <!-- Dotted Separator -->
        <div class="header-separator"></div>

        <!-- Main Nav -->
        <div class="main-nav">
            <!-- Logo -->
            <a href="/" class="logo">
                <span class="logo-text">TicketPass</span>
                <i class="fa-solid fa-asterisk logo-icon"></i>
            </a>

            <!-- Menu Items -->
            <div class="nav-items">
                <a th:href="@{/tickets}"
                    th:classappend="${selectedType == null and tickets != null} ? 'active' : ''">Tất
                    cả</a>
                <a th:href="@{/tickets(ticketType='MOVIE')}"
                    th:classappend="${selectedType != null and selectedType.toUpperCase() == 'MOVIE'} ? 'active' : ''">Phim</a>
                <a th:href="@{/tickets(ticketType='CONCERT')}"
                    th:classappend="${selectedType != null and selectedType.toUpperCase() == 'CONCERT'} ? 'active' : ''">Sự
                    kiện</a>
                <a th:href="@{/tickets(ticketType='BUS')}"
                    th:classappend="${selectedType != null and selectedType.toUpperCase() == 'BUS'} ? 'active' : ''">Xe
                    khách</a>
            </div>

            <!-- Buy/Sell Button -->
            <a th:href="@{/tickets/new}" class="buy-ticket-btn">
                <i class="fa-solid fa-ticket-simple"></i> Đăng vé ngay
            </a>
        </div>

        <!-- Dotted Separator Bottom -->
        <div class="header-separator"></div>
    </header>

    <!-- Main Content Injection -->
    <main class="site-main">
        <div th:replace="${content}"></div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="site-footer-inner">
            TicketPass &copy; 2026. Nền tảng giao dịch vé an toàn.
        </div>
    </footer>

</body>

</html>
