<!DOCTYPE html>
<!--
  Layout khung của toàn bộ giao diện TicketPass.
  Bao gồm: Header (Navbar), Footer, và bộ Design Tokens (CSS Variables) chuẩn tập trung.

  Cách dùng ở các view con:
      <div th:replace="~{layout/base :: layout('Tiêu đề trang', ~{::content})}">
          <content> Nội dung chính của trang </content>
      </div>
-->
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)" lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">TicketPass</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome 6.4.0 for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ==========================================================================
           DESIGN SYSTEM TOKENS (Quy chuẩn thiết kế tập trung)
           ========================================================================== */
        :root {
            /* Typography */
            --font-base: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

            /* Brand & Primary Actions */
            --color-brand: #0f172a;
            /* Slate 900 - Nền nã, uy quyền, cao cấp */
            --color-brand-hover: #1e293b;
            --color-brand-surface: #f1f5f9;

            --color-primary: #e71a0f;
            /* CGV Red - Sắc nét, hành động mua/đăng vé */
            --color-primary-hover: #cc150b;
            --color-primary-surface: #fef2f2;
            --color-primary-border: #fecaca;

            --color-accent: #ea580c;
            /* Orange 600 - Điểm nhấn giá tiền, giao dịch */
            --color-accent-hover: #c2410c;

            /* Semantic Status */
            --color-success: #16a34a;
            /* Xanh lá - Hoàn tất, vé khả dụng, uy tín cao */
            --color-success-hover: #15803d;
            --color-success-surface: #f0fdf4;
            --color-success-border: #bbf7d0;

            --color-warning: #d97706;
            /* Vàng hổ phách - Chờ cọc, chờ xác nhận */
            --color-warning-surface: #fffbeb;
            --color-warning-border: #fde68a;

            --color-danger: #dc2626;
            /* Đỏ - Tranh chấp, hủy vé, cảnh báo lừa đảo */
            --color-danger-surface: #fef2f2;
            --color-danger-border: #fecaca;

            --color-info: #0284c7;
            --color-info-surface: #f0f9ff;
            --color-info-border: #bae6fd;

            /* Background & Surfaces */
            --color-bg: #f8fafc;
            /* Slate 50 - Nền sáng hiện đại, thanh thoát */
            --color-surface: #ffffff;
            /* Trắng thuần cho Card và Container */
            --color-border: #e2e8f0;
            /* Slate 200 */
            --color-border-hover: #cbd5e1;

            /* Text */
            --color-text-main: #0f172a;
            /* Slate 900 */
            --color-text-secondary: #475569;
            /* Slate 600 */
            --color-text-muted: #64748b;
            /* Slate 500 */

            /* Layout & Radius (Fluid Adaptive: tự co giãn theo mọi kích thước màn hình) */
            --container-max-width: min(92vw, 1600px);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --radius-full: 9999px;

            /* Shadows & Motion (Restrained Motion: 2/10) */
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.04);
            --shadow-hover: 0 10px 15px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.03);
            --transition-base: 150ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ==========================================================================
           RESET & GLOBAL STYLES
           ========================================================================== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-base);
            background-color: var(--color-bg);
            color: var(--color-text-main);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        a {
            color: inherit;
            text-decoration: none;
            transition: color var(--transition-base);
        }

        img {
            max-width: 100%;
            display: block;
        }

        /* ==========================================================================
           HEADER & NAVIGATION (CGV Inspired Trust-First Header)
           ========================================================================== */
        .site-header {
            background-color: var(--color-surface);
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: var(--shadow-sm);
            border-bottom: 1px solid var(--color-border);
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            max-width: var(--container-max-width);
            margin: 0 auto;
            padding: 8px 24px;
            font-size: 13px;
            gap: 20px;
            border-bottom: 1px solid #f1f5f9;
        }

        .top-menu {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .top-menu a,
        .top-menu button {
            text-decoration: none;
            color: var(--color-text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            transition: color var(--transition-base);
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }

        .top-menu a:hover,
        .top-menu button:hover {
            color: var(--color-primary);
        }

        .header-separator {
            height: 4px;
            background-color: var(--color-primary);
        }

        .main-nav {
            max-width: var(--container-max-width);
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 4px;
            text-decoration: none;
        }

        .logo-text {
            color: var(--color-primary);
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            line-height: 1;
        }

        .logo-icon {
            color: var(--color-accent);
            font-size: 14px;
        }

        /* Header Search Form */
        .nav-search-form {
            display: flex;
            align-items: center;
            background-color: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-full);
            padding: 2px 4px 2px 14px;
            width: 100%;
            max-width: 360px;
            transition: all var(--transition-base);
            position: relative;
        }

        .nav-search-form:focus-within {
            background-color: var(--color-surface);
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(231, 26, 15, 0.1);
        }

        .nav-search-icon {
            color: var(--color-text-muted);
            font-size: 13px;
            margin-right: 8px;
            flex-shrink: 0;
        }

        .nav-search-input {
            border: none;
            background: transparent;
            font-size: 13px;
            font-family: inherit;
            color: var(--color-text-main);
            width: 100%;
            padding: 7px 0;
            outline: none;
        }

        .nav-search-input::placeholder {
            color: var(--color-text-muted);
            font-size: 13px;
        }

        .nav-search-btn {
            background-color: var(--color-primary);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-full);
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            font-size: 11px;
            transition: all var(--transition-base);
        }

        .nav-search-btn:hover {
            background-color: var(--color-primary-hover);
            transform: scale(1.05);
        }

        .nav-search-btn:active {
            transform: scale(0.95);
        }

        /* Search Suggestions Dropdown */
        .search-suggestions-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background-color: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-hover);
            z-index: 1050;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            animation: fadeInDropdown 150ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeInDropdown {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .suggestion-item {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            gap: 12px;
            text-decoration: none;
            color: var(--color-text-main);
            border-bottom: 1px solid #f1f5f9;
            transition: background-color var(--transition-base);
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-item:hover,
        .suggestion-item.active {
            background-color: var(--color-brand-surface);
        }

        .suggestion-thumb {
            width: 38px;
            height: 38px;
            border-radius: var(--radius-sm);
            object-fit: cover;
            flex-shrink: 0;
            background-color: var(--color-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: var(--color-text-muted);
            border: 1px solid var(--color-border);
        }

        .suggestion-info {
            flex: 1;
            min-width: 0;
        }

        .suggestion-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--color-text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }

        .suggestion-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--color-text-muted);
        }

        .suggestion-price {
            font-size: 13px;
            font-weight: 700;
            color: var(--color-primary);
            flex-shrink: 0;
            text-align: right;
        }

        .suggestion-footer {
            padding: 8px 14px;
            background-color: var(--color-bg);
            border-top: 1px solid var(--color-border);
            font-size: 12px;
            font-weight: 600;
            color: var(--color-primary);
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            display: block;
            transition: background-color var(--transition-base);
        }

        .suggestion-footer:hover {
            background-color: var(--color-primary-surface);
        }

        .suggestion-empty {
            padding: 16px;
            text-align: center;
            font-size: 13px;
            color: var(--color-text-muted);
        }

        .nav-items {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .nav-items a {
            font-size: 14px;
            font-weight: 600;
            color: var(--color-text-main);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            transition: all var(--transition-base);
        }

        .nav-items a:hover,
        .nav-items a.active {
            color: var(--color-primary);
            background-color: var(--color-primary-surface);
        }

        .post-ticket-btn {
            background-color: var(--color-primary);
            color: #ffffff !important;
            font-weight: 600;
            font-size: 14px;
            padding: 8px 18px;
            border-radius: var(--radius-md);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 4px rgba(231, 26, 15, 0.2);
            transition: all var(--transition-base);
        }

        .post-ticket-btn:hover {
            background-color: var(--color-primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(231, 26, 15, 0.3);
        }

        /* ==========================================================================
           MAIN CONTENT AREA
           ========================================================================== */
        .site-main {
            flex: 1;
            width: 100%;
            max-width: var(--container-max-width);
            margin: 0 auto;
            padding: 32px 24px;
        }

        /* ==========================================================================
           COMMON UI COMPONENTS
           ========================================================================== */
        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            border-radius: var(--radius-md);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all var(--transition-base);
            font-family: inherit;
            line-height: 1.4;
            min-height: 42px;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-primary {
            background-color: var(--color-primary);
            color: #ffffff;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: var(--color-primary-hover);
            color: #ffffff;
        }

        .btn-brand {
            background-color: var(--color-brand);
            color: #ffffff;
        }

        .btn-brand:hover:not(:disabled) {
            background-color: var(--color-brand-hover);
            color: #ffffff;
        }

        .btn-outline {
            background-color: transparent;
            border-color: var(--color-border);
            color: var(--color-text-main);
        }

        .btn-outline:hover:not(:disabled) {
            background-color: var(--color-bg);
            border-color: var(--color-border-hover);
        }

        .btn-danger {
            background-color: var(--color-danger);
            color: #ffffff;
        }

        .btn-danger:hover:not(:disabled) {
            background-color: #b91c1c;
        }

        .btn-danger-outline {
            background-color: transparent;
            border-color: var(--color-danger-border);
            color: var(--color-danger);
        }

        .btn-danger-outline:hover:not(:disabled) {
            background-color: var(--color-danger-surface);
        }

        .btn-success {
            background-color: var(--color-success);
            color: #ffffff;
        }

        .btn-success:hover:not(:disabled) {
            background-color: var(--color-success-hover);
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 13px;
            min-height: 34px;
        }

        .btn-lg {
            padding: 14px 28px;
            font-size: 16px;
            min-height: 48px;
        }

        /* Cards */
        .card {
            background-color: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            overflow: hidden;
            transition: all var(--transition-base);
        }

        .card:hover {
            box-shadow: var(--shadow-hover);
        }

        .card-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--color-border);
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-body {
            padding: 20px;
        }

        .card-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--color-border);
            background-color: #fafbfc;
        }

        /* Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 600;
            border-radius: var(--radius-full);
            white-space: nowrap;
        }

        .badge-movie {
            background-color: var(--color-primary-surface);
            color: var(--color-primary);
            border: 1px solid var(--color-primary-border);
        }

        .badge-concert {
            background-color: #f5f3ff;
            color: #7c3aed;
            border: 1px solid #ddd6fe;
        }

        .badge-bus {
            background-color: #ecfeff;
            color: #0891b2;
            border: 1px solid #a5f3fc;
        }

        .badge-success {
            background-color: var(--color-success-surface);
            color: var(--color-success);
            border: 1px solid var(--color-success-border);
        }

        .badge-warning {
            background-color: var(--color-warning-surface);
            color: var(--color-warning);
            border: 1px solid var(--color-warning-border);
        }

        .badge-danger {
            background-color: var(--color-danger-surface);
            color: var(--color-danger);
            border: 1px solid var(--color-danger-border);
        }

        .badge-neutral {
            background-color: var(--color-brand-surface);
            color: var(--color-text-secondary);
            border: 1px solid var(--color-border);
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--color-text-main);
            margin-bottom: 6px;
        }

        .form-label .required {
            color: var(--color-danger);
            margin-left: 2px;
        }

        .form-control {
            width: 100%;
            padding: 10px 14px;
            font-size: 14px;
            font-family: inherit;
            color: var(--color-text-main);
            background-color: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            transition: all var(--transition-base);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(231, 26, 15, 0.1);
        }

        .form-control.is-invalid {
            border-color: var(--color-danger);
            background-color: #fffbfa;
        }

        .form-text {
            display: block;
            margin-top: 4px;
            font-size: 12px;
            color: var(--color-text-muted);
        }

        .form-error {
            display: block;
            margin-top: 6px;
            font-size: 13px;
            color: var(--color-danger);
            font-weight: 500;
        }

        /* Alerts */
        .alert {
            padding: 14px 18px;
            border-radius: var(--radius-md);
            font-size: 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .alert-success {
            background-color: var(--color-success-surface);
            color: var(--color-success);
            border: 1px solid var(--color-success-border);
        }

        .alert-warning {
            background-color: var(--color-warning-surface);
            color: var(--color-warning);
            border: 1px solid var(--color-warning-border);
        }

        .alert-danger {
            background-color: var(--color-danger-surface);
            color: var(--color-danger);
            border: 1px solid var(--color-danger-border);
        }

        .alert-info {
            background-color: var(--color-info-surface);
            color: var(--color-info);
            border: 1px solid var(--color-info-border);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background-color: var(--color-surface);
            border-radius: var(--radius-lg);
            border: 1px dashed var(--color-border);
            margin: 20px 0;
        }

        .empty-icon {
            font-size: 48px;
            color: #cbd5e1;
            margin-bottom: 16px;
        }

        .empty-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--color-text-main);
            margin-bottom: 8px;
        }

        .empty-desc {
            font-size: 14px;
            color: var(--color-text-muted);
            max-width: 440px;
            margin: 0 auto 20px auto;
        }

        /* ==========================================================================
           FOOTER
           ========================================================================== */
        .site-footer {
            border-top: 1px solid var(--color-border);
            background-color: var(--color-surface);
            padding: 32px 0;
            margin-top: auto;
        }

        .site-footer-inner {
            max-width: var(--container-max-width);
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            font-size: 13px;
            color: var(--color-text-muted);
        }

        .footer-brand {
            font-weight: 700;
            color: var(--color-brand);
        }

        .footer-links {
            display: flex;
            gap: 20px;
        }

        .footer-links a:hover {
            color: var(--color-primary);
        }

        /* Responsive Tablet & Small Laptop (Tránh vỡ dòng / Nav Wrap trên iPad và Laptop nhỏ) */
        @media (max-width: 1120px) and (min-width: 769px) {
            .nav-search-form {
                max-width: 220px;
            }

            .nav-items {
                gap: 8px;
            }

            .nav-items a {
                padding: 6px 8px;
                font-size: 13px;
            }

            .post-ticket-btn {
                padding: 8px 12px;
                font-size: 13px;
            }
        }

        /* Responsive Mobile */
        @media (max-width: 768px) {
            :root {
                --container-max-width: 100%;
            }

            .top-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
                padding: 10px 16px;
            }

            .main-nav {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
                padding: 12px 16px;
            }

            .nav-items {
                overflow-x: auto;
                padding-bottom: 4px;
                gap: 8px;
            }

            .site-main {
                padding: 20px 16px;
            }

            .site-footer-inner {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <!-- Header Navigation -->
    <header class="site-header">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="top-menu">
                <a th:href="@{/tickets}"><i class="fa-solid fa-tags"></i> Sàn vé</a>
                <a th:href="@{/reputation/top}"><i class="fa-solid fa-trophy"></i> Bảng xếp hạng</a>

                <th:block th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
                    <a th:href="@{/admin/disputes}"><i class="fa-solid fa-shield-halved"></i> Quản trị tranh chấp</a>
                </th:block>

                <th:block th:if="${#authorization.expression('isAuthenticated()')}">
                    <a th:href="@{/profile}"><i class="fa-solid fa-user-circle"></i> Hồ sơ của tôi</a>
                    <form th:action="@{/logout}" method="post" style="display:inline; margin:0;">
                        <button type="submit"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</button>
                    </form>
                </th:block>

                <th:block th:if="${!#authorization.expression('isAuthenticated()')}">
                    <a th:href="@{/login}"><i class="fa-regular fa-user"></i> Đăng nhập / Đăng ký</a>
                </th:block>
            </div>
        </div>

        <!-- Dotted Separator -->
        <div class="header-separator"></div>

        <!-- Main Nav -->
        <div class="main-nav">
            <!-- Logo -->
            <a th:href="@{/}" class="logo">
                <span class="logo-text">TicketPass</span>
                <i class="fa-solid fa-asterisk logo-icon"></i>
            </a>

            <!-- Search Form -->
            <form th:action="@{/tickets}" method="get" class="nav-search-form" role="search" id="navSearchForm">
                <i class="fa-solid fa-magnifying-glass nav-search-icon"></i>
                <input type="text" name="keyword" th:value="${keyword}"
                       placeholder="Tìm sự kiện, phim, tuyến xe..."
                       class="nav-search-input" id="navSearchInput" autocomplete="off"
                       aria-label="Tìm kiếm vé sự kiện" />
                <input type="hidden" name="ticketType" th:if="${selectedType != null and !selectedType.isEmpty()}" th:value="${selectedType}" />
                <button type="submit" class="nav-search-btn" aria-label="Tìm kiếm">
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

                <!-- Autocomplete Dropdown -->
                <div class="search-suggestions-dropdown" id="navSuggestionsDropdown" style="display: none;"></div>
            </form>

            <!-- Menu Items: 3 loai ve chuan cua san -->
            <div class="nav-items">
                <a th:href="@{/tickets(keyword=${keyword != null and !keyword.isEmpty() ? keyword : null})}"
                    th:classappend="${selectedType == null and tickets != null} ? 'active' : ''">Tất cả vé</a>
                <a th:href="@{/tickets(ticketType='MOVIE', keyword=${keyword != null and !keyword.isEmpty() ? keyword : null})}"
                    th:classappend="${selectedType != null and selectedType.toUpperCase() == 'MOVIE'} ? 'active' : ''">
                    <i class="fa-solid fa-film"></i> Vé xem phim
                </a>
                <a th:href="@{/tickets(ticketType='CONCERT', keyword=${keyword != null and !keyword.isEmpty() ? keyword : null})}"
                    th:classappend="${selectedType != null and selectedType.toUpperCase() == 'CONCERT'} ? 'active' : ''">
                    <i class="fa-solid fa-music"></i> Vé sự kiện
                </a>
                <a th:href="@{/tickets(ticketType='BUS', keyword=${keyword != null and !keyword.isEmpty() ? keyword : null})}"
                    th:classappend="${selectedType != null and selectedType.toUpperCase() == 'BUS'} ? 'active' : ''">
                    <i class="fa-solid fa-bus"></i> Vé xe khách
                </a>
            </div>

            <!-- Post Ticket CTA -->
            <a th:href="@{/tickets/new}" class="post-ticket-btn">
                <i class="fa-solid fa-plus-circle"></i> Đăng vé ngay
            </a>
        </div>
    </header>

    <!-- Main Content Injection -->
    <main class="site-main">
        <div th:replace="${content}"></div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="site-footer-inner">
            <div>
                <span class="footer-brand">TicketPass</span> - Sàn giao dịch vé điện tử an toàn cho người Việt.
            </div>
            <div class="footer-links">
                <a th:href="@{/tickets}">Sàn vé</a>
                <a th:href="@{/reputation/top}">Xếp hạng uy tín</a>
                <a th:href="@{/tickets/new}">Đăng vé</a>
            </div>
            <div>
                TicketPass &copy; 2026. Bảo vệ thanh toán ký quỹ và cọc 50%.
            </div>
        </div>
    </footer>

    <!-- Live Search Autocomplete Script -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            function setupLiveSearch(inputEl, dropdownEl, formEl) {
                if (!inputEl || !dropdownEl) return;

                let debounceTimer = null;
                let activeIndex = -1;

                inputEl.addEventListener('input', function () {
                    const keyword = this.value.trim();
                    clearTimeout(debounceTimer);

                    if (!keyword) {
                        dropdownEl.style.display = 'none';
                        dropdownEl.innerHTML = '';
                        return;
                    }

                    debounceTimer = setTimeout(() => {
                        fetch('/tickets/suggestions?keyword=' + encodeURIComponent(keyword))
                            .then(res => res.json())
                            .then(items => {
                                if (!items || items.length === 0) {
                                    dropdownEl.innerHTML = '<div class="suggestion-empty"><i class="fa-regular fa-face-frown" style="margin-right: 6px;"></i> Không tìm thấy vé sự kiện phù hợp</div>';
                                    dropdownEl.style.display = 'flex';
                                    return;
                                }

                                let html = '';
                                items.forEach((item, idx) => {
                                    const displayName = item.eventName ? item.eventName : item.title;
                                    const subInfo = item.venue ? item.venue : item.title;
                                    const thumbHtml = item.thumbnailUrl
                                        ? `<img src="${item.thumbnailUrl}" class="suggestion-thumb" alt="${displayName}">`
                                        : `<div class="suggestion-thumb"><i class="fa-solid fa-ticket"></i></div>`;

                                    html += `
                                        <a href="${item.detailUrl}" class="suggestion-item" data-index="${idx}">
                                            ${thumbHtml}
                                            <div class="suggestion-info">
                                                <div class="suggestion-title">${displayName}</div>
                                                <div class="suggestion-meta">
                                                    <span class="badge ${item.ticketType === 'MOVIE' ? 'badge-movie' : item.ticketType === 'CONCERT' ? 'badge-concert' : 'badge-bus'}" style="padding: 2px 6px; font-size: 10px;">${item.ticketTypeLabel}</span>
                                                    <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${subInfo}</span>
                                                </div>
                                            </div>
                                            <div class="suggestion-price">${item.formattedPrice}</div>
                                        </a>
                                    `;
                                });

                                html += `<a href="/tickets?keyword=${encodeURIComponent(keyword)}" class="suggestion-footer"><i class="fa-solid fa-magnifying-glass" style="margin-right: 4px;"></i> Xem tất cả kết quả cho "${keyword}"</a>`;

                                dropdownEl.innerHTML = html;
                                dropdownEl.style.display = 'flex';
                                activeIndex = -1;
                            })
                            .catch(err => {
                                console.error('Lỗi tải gợi ý:', err);
                            });
                    }, 250);
                });

                // Keyboard navigation
                inputEl.addEventListener('keydown', function (e) {
                    const items = dropdownEl.querySelectorAll('.suggestion-item');
                    if (dropdownEl.style.display === 'none' || items.length === 0) return;

                    if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        activeIndex = (activeIndex + 1) % items.length;
                        updateActiveItem(items);
                    } else if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        activeIndex = (activeIndex - 1 + items.length) % items.length;
                        updateActiveItem(items);
                    } else if (e.key === 'Enter') {
                        if (activeIndex >= 0 && items[activeIndex]) {
                            e.preventDefault();
                            items[activeIndex].click();
                        }
                    } else if (e.key === 'Escape') {
                        dropdownEl.style.display = 'none';
                    }
                });

                function updateActiveItem(items) {
                    items.forEach((it, idx) => {
                        if (idx === activeIndex) {
                            it.classList.add('active');
                            it.scrollIntoView({ block: 'nearest' });
                        } else {
                            it.classList.remove('active');
                        }
                    });
                }

                // Click outside to close
                document.addEventListener('click', function (e) {
                    if (!inputEl.contains(e.target) && !dropdownEl.contains(e.target)) {
                        dropdownEl.style.display = 'none';
                    }
                });

                // Focus on input opens dropdown if keyword has value
                inputEl.addEventListener('focus', function () {
                    if (this.value.trim() && dropdownEl.innerHTML.trim()) {
                        dropdownEl.style.display = 'flex';
                    }
                });
            }

            // Initialize for Navbar search
            setupLiveSearch(
                document.getElementById('navSearchInput'),
                document.getElementById('navSuggestionsDropdown'),
                document.getElementById('navSearchForm')
            );

            // Initialize for In-page search if present
            setupLiveSearch(
                document.getElementById('pageSearchInput'),
                document.getElementById('pageSuggestionsDropdown'),
                document.getElementById('pageSearchForm')
            );
        });
    </script>

</body>

</html>
