<!DOCTYPE html>
<!--
  Layout khung cua toan bo giao dien TicketPass.
  Bao gom: Header (Navbar), Footer, va bo Design Tokens (CSS Variables) chuan.

  Cach dung o cac view con:
      <div th:replace="~{layout/base :: layout('Tieu de trang', ~{::content})}">
          <content> Noi dung chinh cua trang </content>
      </div>

  Chu so huu giao dien: Nguoi A.
-->
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">TicketPass</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================================
           DESIGN SYSTEM TOKENS (Quy chuan thiet ke)
           ========================================================================== */
        :root {
            /* Typography */
            --font-base: 'Inter', system-ui, -apple-system, sans-serif;
            
            /* Color Palette (Brand) */
            --color-brand: #0f172a; /* Slate 900 - Dark/Premium brand color */
            --color-brand-hover: #1e293b;
            --color-brand-surface: #f1f5f9;
            
            /* Action Colors */
            --color-primary: #2563eb; /* Blue 600 */
            --color-primary-hover: #1d4ed8;
            --color-primary-surface: #eff6ff;
            
            --color-accent: #ea580c; /* Orange 600 - cho gia tien, the hien action mua */
            
            /* Status Colors */
            --color-success: #16a34a; /* Green 600 */
            --color-success-surface: #f0fdf4;
            --color-success-border: #86efac;
            
            --color-warning: #d97706; /* Amber 600 */
            --color-warning-surface: #fffbeb;
            --color-warning-border: #fcd34d;
            
            --color-danger: #dc2626; /* Red 600 */
            --color-danger-surface: #fef2f2;
            --color-danger-border: #fca5a5;
            
            /* Surface & Background */
            --color-bg: #f8fafc; /* Nen toan trang - trang sang / xam rat nhat */
            --color-surface: #ffffff; /* Nen the/card */
            --color-border: #e2e8f0;
            --color-border-hover: #cbd5e1;
            
            /* Text Colors */
            --color-text-main: #0f172a;
            --color-text-muted: #64748b;
            
            /* Spacing & Layout */
            --container-max-width: 1120px;
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
            
            /* Radii & Shadows (Clean, no excessive soft shadows) */
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            
            /* Transitions */
            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ==========================================================================
           RESET & GLOBAL STYLES
           ========================================================================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-base);
            background-color: var(--color-bg);
            color: var(--color-text-main);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        a {
            color: inherit;
            text-decoration: none;
            transition: color var(--transition-fast);
        }

        /* ==========================================================================
           HEADER (NAVBAR)
           ========================================================================== */
        .site-header {
            background-color: var(--color-surface);
            border-bottom: 1px solid var(--color-border);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .site-header-inner {
            max-width: var(--container-max-width);
            margin: 0 auto;
            padding: 0 var(--spacing-lg);
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .site-brand {
            font-size: 20px;
            font-weight: 700;
            color: var(--color-brand);
            letter-spacing: -0.5px;
        }

        .site-nav {
            display: flex;
            align-items: center;
            gap: var(--spacing-lg);
        }

        .site-nav a {
            font-size: 14px;
            font-weight: 500;
            color: var(--color-text-muted);
        }

        .site-nav a:hover,
        .site-nav a.active {
            color: var(--color-brand);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }

        /* Buttons (Base styles cho toan site) */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            border-radius: var(--radius-md);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all var(--transition-fast);
            font-family: inherit;
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-brand {
            background-color: var(--color-brand);
            color: white;
        }

        .btn-brand:hover:not(:disabled) {
            background-color: var(--color-brand-hover);
        }

        .btn-outline {
            background-color: transparent;
            border-color: var(--color-border);
            color: var(--color-text-main);
        }

        .btn-outline:hover:not(:disabled) {
            background-color: var(--color-bg);
            border-color: var(--color-border-hover);
        }
        
        .btn-danger {
            background-color: transparent;
            border-color: var(--color-danger-border);
            color: var(--color-danger);
        }
        
        .btn-danger:hover:not(:disabled) {
            background-color: var(--color-danger-surface);
        }

        /* Form Reset to mau button logout */
        .nav-actions form {
            margin: 0;
        }
        
        /* Mobile menu toggle (An tren desktop) */
        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--color-text-main);
        }

        /* ==========================================================================
           MAIN CONTENT AREA
           ========================================================================== */
        .site-main {
            flex: 1;
            width: 100%;
            max-width: var(--container-max-width);
            margin: 0 auto;
            padding: var(--spacing-xl) var(--spacing-lg);
        }

        /* ==========================================================================
           FOOTER
           ========================================================================== */
        .site-footer {
            border-top: 1px solid var(--color-border);
            background-color: var(--color-surface);
            padding: var(--spacing-lg) 0;
            margin-top: auto;
        }

        .site-footer-inner {
            max-width: var(--container-max-width);
            margin: 0 auto;
            padding: 0 var(--spacing-lg);
            text-align: center;
            font-size: 13px;
            color: var(--color-text-muted);
        }

        /* ==========================================================================
           RESPONSIVE DESIGN (EDGE CASES)
           ========================================================================== */
        @media (max-width: 768px) {
            .site-nav {
                display: none; /* Xu ly gian luoc tren mobile, thuong the bang menu dropdown, nhung o day gian luoc UI */
            }
            .mobile-menu-btn {
                display: block;
            }
            .site-header-inner {
                padding: 0 var(--spacing-md);
            }
            .site-main {
                padding: var(--spacing-lg) var(--spacing-md);
            }
            /* Button tren mobile auto full width khi can */
            .btn-mobile-full {
                width: 100%;
            }
        }
        
        /* Utility Classes */
        .text-truncate {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .text-truncate-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="site-header">
        <div class="site-header-inner">
            <a href="/" class="site-brand">TicketPass</a>
            
            <nav class="site-nav">
                <a th:href="@{/tickets}">Ve dang ban</a>
                <!-- Neu co User session, hien thi menu khac -->
                <th:block th:if="${#authorization.expression('isAuthenticated()')}">
                    <a th:href="@{/profile}">Ho so</a>
                </th:block>
            </nav>

            <div class="nav-actions">
                <!-- Chua dang nhap -->
                <th:block th:if="${!#authorization.expression('isAuthenticated()')}">
                    <a th:href="@{/login}" class="btn btn-outline">Dang nhap</a>
                    <a th:href="@{/register}" class="btn btn-brand">Dang ky</a>
                </th:block>
                
                <!-- Da dang nhap -->
                <th:block th:if="${#authorization.expression('isAuthenticated()')}">
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="btn btn-outline">Dang xuat</button>
                    </form>
                </th:block>
            </div>
        </div>
    </header>

    <!-- Main Content Injection -->
    <main class="site-main">
        <div th:replace="${content}"></div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="site-footer-inner">
            TicketPass &copy; 2026. Nen tang giao dich ve an toan.
        </div>
    </footer>

</body>
</html>
