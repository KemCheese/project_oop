<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thông báo lỗi - TicketPass</title>
    <style>
        body { font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 80vh; margin: 0; background-color: #f1f5f9; }
        .error-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); max-width: 500px; text-align: center; }
        h1 { color: #ef4444; margin-top: 0; font-size: 28px; }
        p { color: #475569; font-size: 16px; line-height: 1.5; }
        a { display: inline-block; margin-top: 20px; padding: 10px 20px; background: #2563eb; color: white; text-decoration: none; border-radius: 6px; font-weight: 500; }
        a:hover { background: #1d4ed8; }
    </style>
</head>
<body>
<div class="error-card">
    <h1 th:text="${statusCode != null ? 'Lỗi ' + statusCode : 'Có lỗi xảy ra'}">Có lỗi xảy ra</h1>
    <p th:text="${errorMessage != null ? errorMessage : 'Hệ thống đang gặp sự cố. Vui lòng thử lại sau.'}">Hệ thống đang gặp sự cố.</p>
    <a href="/">Quay về Trang chủ</a>
</div>
</body>
</html>
