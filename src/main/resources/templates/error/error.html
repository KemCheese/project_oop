<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Thông báo lỗi - TicketPass</title>
</head>

<body>
    <div th:replace="~{layout/base :: layout('Thông báo lỗi - TicketPass', ~{::content})}">
        <content>
            <style>
                .error-wrapper {
                    max-width: 520px;
                    margin: 60px auto;
                    background-color: var(--color-surface);
                    border: 1px solid var(--color-border);
                    border-radius: var(--radius-lg);
                    padding: 40px 30px;
                    text-align: center;
                    box-shadow: var(--shadow-card);
                }

                .error-icon-box {
                    width: 72px;
                    height: 72px;
                    border-radius: 50%;
                    background-color: var(--color-danger-surface);
                    color: var(--color-danger);
                    border: 2px solid var(--color-danger-border);
                    display: inline-flex;
                    align-items: center;
                    justify-content: center;
                    font-size: 32px;
                    margin-bottom: 20px;
                }

                .error-title {
                    font-size: 24px;
                    font-weight: 800;
                    color: var(--color-brand);
                    margin-bottom: 10px;
                }

                .error-message {
                    font-size: 14px;
                    color: var(--color-text-secondary);
                    line-height: 1.6;
                    margin-bottom: 28px;
                }
            </style>

            <div class="error-wrapper">
                <div class="error-icon-box">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>

                <h1 class="error-title" th:text="${statusCode != null ? 'Lỗi ' + statusCode : 'Có lỗi xảy ra'}">
                    Có lỗi xảy ra
                </h1>

                <p class="error-message"
                   th:text="${errorMessage != null ? errorMessage : 'Trang bạn tìm kiếm không tồn tại hoặc hệ thống đang gặp sự cố gián đoạn tạm thời. Vui lòng thử lại sau.'}">
                    Trang bạn tìm kiếm không tồn tại hoặc hệ thống đang gặp sự cố gián đoạn tạm thời. Vui lòng thử lại sau.
                </p>

                <div style="display: flex; gap: 12px; justify-content: center;">
                    <a th:href="@{/}" class="btn btn-primary">
                        <i class="fa-solid fa-house"></i> Quay về trang chủ
                    </a>
                    <a th:href="@{/tickets}" class="btn btn-outline">
                        <i class="fa-solid fa-tags"></i> Xem sàn vé
                    </a>
                </div>
            </div>
        </content>
    </div>
</body>

</html>
