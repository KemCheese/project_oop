# =====================================================================
# Cau hinh danh rieng cho test (profile "test").
# Test chay tren H2 in-memory: Hibernate TU SINH schema (ddl-auto=create-drop),
# con Flyway bi TAT vi cac file migration viet bang SQL dac thu MySQL
# (ENGINE=InnoDB, kieu du lieu rieng...) se lam H2 chay loi va pha test.
# =====================================================================
spring.datasource.url=jdbc:h2:mem:ticketpass;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.flyway.enabled=false

# =====================================================================
# Cac key app.* nghiep vu duoc chep lai tu src/main/resources/application.properties
# de context test khong thieu cau hinh khi bind @ConfigurationProperties.
# =====================================================================

# --- Luu file (FileStorageService / LocalFileStorageAdapter) ---
app.storage.local.base-dir=./data/uploads
app.storage.local.public-url-prefix=/files

# --- OCR ---
app.ocr.engine=TESSERACT
app.ocr.tessdata-path=./tessdata
app.ocr.language=vie+eng
app.ocr.min-confidence=70
app.ocr.enabled=true

# --- MoMo Test Environment ---
app.payment.momo.gateway-name=MOMO_TEST
app.payment.momo.endpoint=https://test-payment.momo.vn/v2/gateway/api/create
app.payment.momo.partner-code=MOMO_TEST_PARTNER
app.payment.momo.access-key=CHANGE_ME
app.payment.momo.secret-key=CHANGE_ME
app.payment.momo.return-url=http://localhost:8080/payment/momo/return
app.payment.momo.ipn-url=http://localhost:8080/payment/momo/ipn
app.payment.momo.request-timeout-seconds=30

# --- Hoa hong theo bac gia ve (tra bang, KHONG luy tien) ---
app.commission.min-fee=5000
app.commission.buyer-share-ratio=0.5
app.commission.seller-share-ratio=0.5
app.commission.tiers[0].code=UNDER_1M
app.commission.tiers[0].exclusive-upper-bound=1000000
app.commission.tiers[0].rate-percent=7
app.commission.tiers[1].code=UNDER_5M
app.commission.tiers[1].exclusive-upper-bound=5000000
app.commission.tiers[1].rate-percent=5
app.commission.tiers[2].code=UNDER_10M
app.commission.tiers[2].exclusive-upper-bound=10000000
app.commission.tiers[2].rate-percent=3
app.commission.tiers[3].code=FROM_10M
app.commission.tiers[3].rate-percent=2
app.commission.tiers[3].max-commission=400000
app.commission.founder-forfeit-rate-percent=7
app.commission.founder-forfeit-min-amount=5000

# --- Thue (STUB cho do an, khong phai luat thue thuc te) ---
app.tax.enabled=true
app.tax.mock=true
app.tax.rate-percent=1.5
app.tax.taxable-threshold=5000000

# --- Coc & cua so khieu nai ---
app.deposit.percent=50
app.dispute.window.movie-hours=2
app.dispute.window.concert-hours=24
app.dispute.window.bus-hours=3
